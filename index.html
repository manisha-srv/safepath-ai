<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SafePath AI — Driver App</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="app-header">
  <div>
    <h1>SafePath AI</h1>
    <div class="tag">DRIVER APP</div>
  </div>
</header>

<nav class="app-nav">
  <a href="index.html" class="active">Driver App</a>
  <a href="dashboard.html">City Dashboard</a>
</nav>

<div class="auth-card" id="authCard">
  <div id="authSignedOutView" class="auth-row">
    <input type="email" id="authEmail" placeholder="Email" autocomplete="email" />
    <input type="password" id="authPassword" placeholder="Password" autocomplete="current-password" />
    <button class="mini" id="authSignInBtn">Log In</button>
    <button class="mini ghost" id="authSignUpBtn">Sign Up</button>
  </div>
  <div id="authSignedInView" class="auth-row" style="display:none;">
    <span>Signed in as <strong id="authUserEmail"></strong></span>
    <button class="mini ghost" id="authSignOutBtn">Sign Out</button>
  </div>
  <div class="status-text" id="authStatus"></div>
</div>

<main>
  <div class="status-card">
    <div class="status-dot" id="statusDot"></div>
    <div class="status-text" id="statusText">Sensors not started yet. Tap "Start Monitoring" below.</div>
  </div>

  <div class="queue-badge" id="queueBadge" style="display:none;"></div>

  <div id="map"></div>

  <div class="btn-row">
    <button class="primary" id="startBtn">Start Monitoring</button>
    <button class="secondary" id="simulateBtn" disabled>Simulate Pothole Hit</button>
  </div>

  <div class="log-card" id="photoCard" style="display:none; margin-bottom:14px;">
    <h3>Add a Photo (Optional)</h3>
    <p class="status-text" style="margin:0 0 10px 0;">
      When it's safe, snap a photo of the last hazard — helps the city confirm what was reported.
    </p>
    <input type="file" accept="image/*" capture="environment" id="photoInput" />
    <div class="status-text" id="photoStatus" style="margin-top:8px;"></div>
    <img id="photoPreview" style="display:none; max-width:100%; border-radius:8px; margin-top:10px;" />
    <div class="btn-row" style="margin-top:10px; margin-bottom:0;">
      <button class="secondary" id="skipPhotoBtn">Skip</button>
    </div>
  </div>

  <div class="log-card">
    <h3>Hazards Logged This Session</h3>
    <div id="logList">
      <div class="empty-state">No hazards logged yet.</div>
    </div>
  </div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/blazeface@0.1.0/dist/blazeface.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>

</body>
</html>
