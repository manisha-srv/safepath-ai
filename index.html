<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SafePath AI — Driver App</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="app-header">
  <div>
    <h1>SafePath AI</h1>
    <div class="tag">DRIVER APP</div>
  </div>
</header>

<nav class="app-nav">
  <a href="index.html" class="active">Driver App</a>
  <a href="dashboard.html">City Dashboard</a>
</nav>

<main>
  <div class="status-card">
    <div class="status-dot" id="statusDot"></div>
    <div class="status-text" id="statusText">Sensors not started yet. Tap "Start Monitoring" below.</div>
  </div>

  <div class="queue-badge" id="queueBadge" style="display:none;"></div>

  <div id="map"></div>

  <div class="btn-row">
    <button class="primary" id="startBtn">Start Monitoring</button>
    <button class="secondary" id="simulateBtn" disabled>Simulate Pothole Hit</button>
  </div>

  <div class="log-card">
    <h3>Hazards Logged This Session</h3>
    <div id="logList">
      <div class="empty-state">No hazards logged yet.</div>
    </div>
  </div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/app.js"></script>

</body>
</html>
